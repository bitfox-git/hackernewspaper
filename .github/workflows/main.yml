on:
  workflow_dispatch:
  schedule:
     - cron: '0 6 * * *'



jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo content
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5.0.0
        with:
          cache: "pip"
      
      - name: Install Python packages
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          python3 -m pip install -r requirements.txt

      
      - name: Determine next edition
        id: determine-edition
        run: |
          git fetch origin --tags

          source .venv/bin/activate
          # Get the latest edition from Python script, a failure here fails the run
          latest_edition=$(python get_latest_edition.py)
          echo "EDITION=$latest_edition" >> "$GITHUB_OUTPUT"

          # Nothing to do is not an error: skip the remaining steps but keep the run green
          if [ -n "$(git tag -l "$latest_edition")" ]; then
              echo "::notice::Edition $latest_edition is already released, nothing to do."
              echo "BUILD=false" >> "$GITHUB_OUTPUT"
          else
              echo "New edition $latest_edition found, building it."
              echo "BUILD=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Playwright
        if: steps.determine-edition.outputs.BUILD == 'true'
        run: |
          source .venv/bin/activate
          playwright install chromium

      - name: Execute Python script
        if: steps.determine-edition.outputs.BUILD == 'true'
        env: 
          YOUTUBE_API_KEY: ${{secrets.YOUTUBE_API_KEY}}
        run: |
          source .venv/bin/activate
          python generator.py ${{steps.determine-edition.outputs.EDITION }}

      - name: Setup Tectonic 
        if: steps.determine-edition.outputs.BUILD == 'true'
        uses: WtfJoke/setup-tectonic@v3
        with:
           github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Print Tectonic version
        if: steps.determine-edition.outputs.BUILD == 'true'
        run: tectonic --version

      - name: Run Tectonic
        if: steps.determine-edition.outputs.BUILD == 'true'
        run: tectonic -X compile output.tex -Z continue-on-errors

      - name: Rename output.pdf
        if: steps.determine-edition.outputs.BUILD == 'true'
        run: mv output.pdf HackerNewsPaper-${{ steps.determine-edition.outputs.EDITION }}.pdf

      - name: Upload a Build Artifact
        if: always() && steps.determine-edition.outputs.BUILD == 'true'
        uses: actions/upload-artifact@v4.3.1
        with:
          path: |
            ./*.*
            !./.venv

      - name: Create release
        if: steps.determine-edition.outputs.BUILD == 'true'
        uses: ncipollo/release-action@v1.14.0
        with:
          allowUpdates: true
          tag: ${{ steps.determine-edition.outputs.EDITION }}
          name: "HackerNewsPaper #${{ steps.determine-edition.outputs.EDITION }}" 
          body: "HackerNewsPaper #${{ steps.determine-edition.outputs.EDITION }}"
          artifacts: "HackerNewsPaper-${{ steps.determine-edition.outputs.EDITION }}.pdf"
          removeArtifacts: true